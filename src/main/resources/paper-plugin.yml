name: SharedChest
version: '${project.version}'
main: com.example.sharedchest.SharedChestPlugin
api-version: '26.3'
folia-supported: true
description: 'Cross-server shared chest plugin for Folia'

permissions:
  sharedchest.use:
    description: '/gchest で共有チェストを開く'
    default: true
  sharedchest.reload:
    description: '/gchest reload で設定を再読み込みする'
    default: op
