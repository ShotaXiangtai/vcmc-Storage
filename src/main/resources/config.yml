database:
  host: "localhost"
  port: 3306
  name: "sharedchest"
  user: "root"
  password: "password"
  pool-size: 5
  # データベースとの通信を TLS で暗号化するか。別のマシンの MySQL へ接続するときは true を推奨します
  use-ssl: false

chest:
  # チェストのタイトル（日本語）
  title: "<gold>共有チェスト"
  rows: 3

# 日本語の文面（MiniMessage 形式）
# ほかの言語の文面は lang フォルダにあります。en.yml: English、zh_cn.yml: 简体中文、zh_tw.yml: 繁體中文（台灣）、zh_hk.yml: 繁體中文（香港）
# プレイヤーのクライアントの言語設定に合わせて自動で切り替わります。変更後は /gchest reload で反映されます。
messages:
  busy: "<red>別のサーバーで共有チェストを開いているか、処理中です。しばらく待ってから再度お試しください。"
  db-error: "<red>共有チェストを読み込めませんでした。時間をおいて再度お試しください。解決しない場合は運営へお知らせください。"
  open-failed: "<red>チェストを開けませんでした。再度お試しください。"
  player-only: "<red>このコマンドはプレイヤーのみ使用できます。"
  reloaded: "<green>設定を再読み込みしました。データベースの設定の変更には再起動が必要です。"
